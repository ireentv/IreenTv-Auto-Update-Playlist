name: Automated Sports Data JSON & M3U Updater

on:
  schedule:
    - cron: '*/15 * * * *'   # প্রতি ১৫ মিনিট পর পর স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch:
  repository_dispatch:
    types: [update-playlist] # রেন্ডার ওয়াচার বটের সংকেত

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "ireentv"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz urllib3

      - name: Fetch, Filter and Generate Separate JSON & All Multi-Server M3U Playlists
        env:
          JSON_PLAYLIST_URLS: ${{ secrets.JSON_PLAYLIST_URLS }}
        run: |
          git pull origin main --rebase

          cat << 'EOF' > update_playlist.py
          import os
          import re
          import json
          import requests
          import urllib3
          from datetime import datetime, timedelta
          import pytz

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          tz_bd = pytz.timezone("Asia/Dhaka")
          now_bd = datetime.now(tz_bd)
          current_time = now_bd.strftime("%I:%M %p %d-%m-%Y BST")

          raw_urls = os.environ.get("JSON_PLAYLIST_URLS", "")
          lines = [u.strip() for u in raw_urls.splitlines() if u.strip() and not u.strip().startswith("#")]

          # ================= TIMEZONE CONVERTER TO BST =================
          def parse_raw_datetime(time_str):
              if not time_str or not isinstance(time_str, (str, int, float)):
                  return None
              
              t_str = str(time_str).strip()
              if not t_str or t_str.lower() in ["24/7", "live", "n/a", "none", "tbd"]:
                  return None

              bd_tz = pytz.timezone("Asia/Dhaka")
              ist_tz = pytz.timezone("Asia/Kolkata")
              utc_tz = pytz.timezone("UTC")

              # Timestamp (Unix seconds/milliseconds)
              if re.match(r'^\d{10,13}$', t_str):
                  ts = int(t_str)
                  if len(t_str) == 13:
                      ts = ts / 1000.0
                  return datetime.fromtimestamp(ts, tz=bd_tz)

              is_ist = bool(re.search(r'\bIST\b', t_str, re.IGNORECASE))
              is_utc = bool(re.search(r'\b(UTC|GMT|Z)\b', t_str, re.IGNORECASE))

              clean_t = re.sub(r'\s*(IST|UTC|GMT|BST|Z)\s*$', '', t_str, flags=re.IGNORECASE).strip()

              formats = [
                  "%d/%m/%Y %I:%M %p",
                  "%d-%m-%Y %I:%M %p",
                  "%Y-%m-%d %I:%M %p",
                  "%d/%m/%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M",
                  "%d-%m-%Y %H:%M:%S",
                  "%d-%m-%Y %H:%M",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%dT%H:%M:%SZ",
                  "%Y-%m-%dT%H:%M:%S%z",
                  "%Y-%m-%dT%H:%M:%S.%fZ",
                  "%Y-%m-%dT%H:%M:%S",
                  "%I:%M %p %d-%m-%Y",
                  "%I:%M %p %d/%m/%Y",
                  "%b %d, %Y %I:%M %p",
                  "%b %d, %Y, %I:%M:%S %p",
                  "%d %b %Y %I:%M %p",
                  "%d %B %Y %I:%M %p"
              ]

              parsed_dt = None
              for fmt in formats:
                  try:
                      parsed_dt = datetime.strptime(clean_t, fmt)
                      break
                  except ValueError:
                      continue

              if parsed_dt:
                  if parsed_dt.tzinfo is not None:
                      return parsed_dt.astimezone(bd_tz)
                  elif is_ist:
                      return ist_tz.localize(parsed_dt).astimezone(bd_tz)
                  elif is_utc or "T" in clean_t:
                      return utc_tz.localize(parsed_dt).astimezone(bd_tz)
                  else:
                      return ist_tz.localize(parsed_dt).astimezone(bd_tz)

              return None

          def convert_to_bangladesh_time(time_str):
              dt = parse_raw_datetime(time_str)
              if dt:
                  return dt.strftime("%d/%m/%Y %I:%M %p BST")
              return str(time_str).strip() if time_str else ""

          # ================= INTELLIGENT DYNAMIC STATUS EVALUATOR =================
          def evaluate_status(raw_status, time_val_or_str, default_if_unknown="UPCOMING"):
              status_str = str(raw_status or "").strip().lower()

              if status_str in ["ended", "finished", "completed", "closed"]:
                  return "ENDED"
              
              source_indicates_upcoming = status_str in ["upcoming", "scheduled", "not started", "fixture"]
              source_indicates_live = status_str in ["live", "playing", "in_progress", "started", "active"]

              dt = parse_raw_datetime(time_val_or_str)
              if dt:
                  if dt > now_bd:
                      return "UPCOMING"
                  elif dt <= now_bd and (now_bd - dt) <= timedelta(hours=4):
                      if not source_indicates_upcoming:
                          return "LIVE"
                      return "UPCOMING"
                  elif (now_bd - dt) > timedelta(hours=4):
                      if source_indicates_live:
                          return "LIVE"
                      return "ENDED"

              if source_indicates_live:
                  return "LIVE"
              if source_indicates_upcoming:
                  return "UPCOMING"

              return default_if_unknown

          def is_live_event(item):
              if not isinstance(item, dict):
                  return False
              st = str(item.get("status", "")).upper()
              if st == "LIVE":
                  return True
              if item.get("is_playing") is True:
                  return True
              return False

          # ================= PROMO ITEM =================
          PROMO_ITEM = {
              "match_id": "ireentv_promo",
              "title": "IreenTV Promo",
              "synopsis": "IreenTV Official 24/7 Promo",
              "status": "LIVE",
              "time": "24/7",
              "cover_image": "https://i.ibb.co.com/XkDv6gpS/ireenTV.png",
              "match_url": "https://ireentvlive.pages.dev/promo/master.m3u8",
              "is_free": True,
              "stream_url": [
                  {
                      "channel_name": "Server 1",
                      "stream_type": "HLS",
                      "url": "https://ireentvlive.pages.dev/promo/master.m3u8",
                      "raw_link": "https://ireentvlive.pages.dev/promo/master.m3u8",
                      "headers": {},
                      "drm_key": ""
                  }
              ]
          }

          def fetch_data(url):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*"
              }
              res = requests.get(url, headers=headers, timeout=30, verify=False)
              res.raise_for_status()
              clean_text = res.content.decode('utf-8-sig', errors='ignore').strip()
              return json.loads(clean_text)

          def is_mpd_or_m3u8(url):
              if not url or not isinstance(url, str):
                  return False
              u_str = url.strip()
              if not (u_str.startswith("http://") or u_str.startswith("https://")):
                  return False

              clean_path = u_str.split("|")[0].split("?")[0].lower()
              full_url = u_str.lower()

              if ".m3u8" in clean_path or ".mpd" in clean_path or ".m3u8" in full_url or ".mpd" in full_url:
                  if any(clean_path.endswith(ext) for ext in [".html", ".htm", ".php"]):
                      return False
                  return True
              return False

          # ================= UNIFIED STREAM OBJECT BUILDER =================
          def normalize_channel_list(raw_item):
              """
              ইভেন্ট থেকে সব চ্যানেল এক্সট্র্যাক্ট করে এবং ডুপ্লিকেট সম্পূর্ণরূপে বাতিল করে।
              """
              channels = []
              seen_urls = set()

              def add_channel(name, stream_url, stream_type=None, headers=None, drm_key=None):
                  if not stream_url or not isinstance(stream_url, str):
                      return
                  s_raw = stream_url.strip()
                  base_url = s_raw.split("|")[0].split("?")[0].strip()
                  
                  # ডুপ্লিকেট রোধ করার মূল চেক
                  if not is_mpd_or_m3u8(base_url) or base_url.lower() in seen_urls:
                      return
                  
                  seen_urls.add(base_url.lower())

                  st_type = stream_type or ("DASH" if ".mpd" in base_url.lower() else "HLS")
                  h_data = headers if isinstance(headers, dict) else {}
                  d_key = str(drm_key or "").strip()

                  # পাইপ (|) থাকলে হেডার পার্স করা
                  if "|" in s_raw and not h_data:
                      pipe_part = s_raw.split("|", 1)[1]
                      for pair in pipe_part.split("&"):
                          if "=" in pair:
                              k, v = pair.split("=", 1)
                              k_low = k.strip().lower()
                              if "user-agent" in k_low:
                                  h_data["user-agent"] = v.strip()
                              elif "refer" in k_low:
                                  h_data["referer"] = v.strip()

                  channels.append({
                      "channel_name": str(name).strip(),
                      "stream_type": st_type,
                      "url": s_raw.split("|")[0].strip(),
                      "raw_link": s_raw,
                      "headers": h_data,
                      "drm_key": d_key
                  })

              # ১. channels বা streams লিস্ট চেক (যেকোনো একটি অগ্রাধিকার পাবে যাতে ডাবল না হয়)
              ch_source = raw_item.get("channels")
              if not ch_source or not isinstance(ch_source, list) or len(ch_source) == 0:
                  ch_source = raw_item.get("streams")

              if isinstance(ch_source, list):
                  for idx, s in enumerate(ch_source, 1):
                      if isinstance(s, dict):
                          s_name = s.get("channel_name") or s.get("name") or f"Server {idx}"
                          s_raw = s.get("raw_link") or s.get("url") or s.get("link") or s.get("stream_url")
                          drm_k = s.get("drm_key") or s.get("clearkey") or s.get("clear_key") or s.get("key") or ""
                          add_channel(s_name, s_raw, s.get("stream_type"), s.get("headers"), drm_k)
                      elif isinstance(s, str):
                          add_channel(f"Server {idx}", s)

              # ২. stream_url ডিকশনারি বা স্ট্রিং হলে
              raw_su = raw_item.get("stream_url")
              if isinstance(raw_su, dict):
                  for s_name, s_url in raw_su.items():
                      add_channel(s_name, s_url)
              elif isinstance(raw_su, str) and raw_su:
                  add_channel("Server 1", raw_su)

              # ৩. সনি লিভ / অন্যান্য স্পেশাল কি
              stream_info = raw_item.get("stream_info", {}) if isinstance(raw_item.get("stream_info"), dict) else {}
              video_info = raw_item.get("video_info", {}) if isinstance(raw_item.get("video_info"), dict) else {}
              
              for label, u in [
                  ("Original Server", stream_info.get("dai_url")),
                  ("Original Server", stream_info.get("dai_asset_key")),
                  ("Original Server", raw_item.get("dai_url")),
                  ("Original Server", raw_item.get("dai_asset_key")),
                  ("Server 1", raw_item.get("playback_url")),
                  ("Server 1", raw_item.get("manifest_url")),
                  ("Server 1", raw_item.get("video_url")),
                  ("Server 1", raw_item.get("url")),
                  ("Server 1", stream_info.get("playback_url")),
                  ("Server 1", video_info.get("playback_url")),
              ]:
                  if u and isinstance(u, str):
                      add_channel(label, u)

              # ৪. এক্সট্রাক্টেড লিঙ্কস (বিংস্ট্রিম)
              for u in raw_item.get("extracted_links", []):
                  if isinstance(u, str):
                      add_channel(f"Server {len(channels) + 1}", u)

              return channels

          # ================= MASTER EVENT TRANSFORMER =================
          def transform_universal_item(item):
              if not isinstance(item, dict):
                  return None

              # ১. চ্যানেল অবজেক্ট তৈরি (ডুপ্লিকেট মুক্ত)
              clean_channels = normalize_channel_list(item)
              first_match_url = clean_channels[0]["raw_link"] if clean_channels else (item.get("match_url") or "")

              # ২. টাইটেল ঠিক করা (ডাবল টাইটেল রোধ)
              teams = item.get("teams", {}) if isinstance(item.get("teams"), dict) else {}
              team_a = teams.get("team_a", {}) if isinstance(teams.get("team_a"), dict) else (item.get("team_a", {}) if isinstance(item.get("team_a"), dict) else {})
              team_b = teams.get("team_b", {}) if isinstance(teams.get("team_b"), dict) else (item.get("team_b", {}) if isinstance(item.get("team_b"), dict) else {})
              
              team_a_name = (team_a.get("name") if isinstance(team_a, dict) else "") or item.get("localteam_name") or ""
              team_b_name = (team_b.get("name") if isinstance(team_b, dict) else "") or item.get("visitorteam_name") or ""
              
              v_info = item.get("video_info", {}) if isinstance(item.get("video_info"), dict) else {}
              existing_title = (
                  v_info.get("episodeTitle") or 
                  v_info.get("title") or 
                  item.get("title") or 
                  item.get("name") or 
                  item.get("event_name") or 
                  item.get("VideoName") or 
                  ""
              ).strip()

              if team_a_name and team_b_name:
                  match_title = f"{team_a_name} vs {team_b_name}".strip()
                  if not existing_title or existing_title.lower() == match_title.lower():
                      title = match_title
                  elif match_title.lower() in existing_title.lower():
                      title = existing_title
                  else:
                      title = f"{existing_title}: {match_title}"
              else:
                  title = existing_title or "Sports Match"

              # ৩. সাইনপসিস ও ক্যাটাগরি
              category = item.get("sport") or item.get("CategoryName") or item.get("category", "")
              synopsis = item.get("sub_category") or item.get("synopsis") or item.get("description") or (f"{category} | {title}" if category else title)

              # ৪. কভার ইমেজ
              img_cdn = item.get("image_cdn", {}) if isinstance(item.get("image_cdn"), dict) else {}
              cover_image = (
                  img_cdn.get("landscape_thumb") or 
                  img_cdn.get("thumbnail") or 
                  item.get("ThumbnailTV") or 
                  item.get("ThumbnailStandard") or 
                  item.get("cover_image") or 
                  item.get("logo") or 
                  item.get("event_logo") or 
                  item.get("thumbnail") or ""
              )

              # ৫. টাইম ও ডাইনামিক স্ট্যাটাস
              sched = item.get("schedule", {}) if isinstance(item.get("schedule"), dict) else {}
              air_dates = item.get("air_dates", {}) if isinstance(item.get("air_dates"), dict) else {}

              raw_time = (
                  sched.get("start_time_bst") or 
                  sched.get("raw_start_utc") or 
                  air_dates.get("originalAirDate") or 
                  air_dates.get("start_date") or 
                  item.get("EventStartDate") or 
                  item.get("schedule_time") or 
                  item.get("time") or 
                  item.get("start_time") or 
                  item.get("bd_time") or 
                  item.get("broadcastDate") or ""
              )
              time_val = convert_to_bangladesh_time(raw_time)

              raw_status = item.get("status") or item.get("Status") or ("LIVE" if item.get("is_playing") else None)
              status = evaluate_status(raw_status, raw_time, default_if_unknown="UPCOMING")

              # ৬. ম্যাচ আইডি
              match_id = str(
                  item.get("match_id") or 
                  item.get("slug") or 
                  item.get("id") or 
                  item.get("contentId") or 
                  item.get("assetId") or 
                  item.get("EntityId") or 
                  title.lower().replace(" ", "-")
              )

              return {
                  "match_id": match_id,
                  "title": title,
                  "synopsis": synopsis,
                  "status": status,
                  "time": time_val,
                  "cover_image": cover_image,
                  "match_url": first_match_url,
                  "is_free": item.get("is_free") or item.get("IsFreeToWatch", False),
                  "stream_url": clean_channels
              }

          # ================= ALL-FORMAT JSON EXTRACTOR =================
          def extract_items_from_json(data):
              """
              সব ধরনের কাঠামো (JSON API, Zyphora, SonyLIV containers, flat lists) সাপোর্ট করে।
              """
              collected = []

              if isinstance(data, list):
                  for el in data:
                      if isinstance(el, dict):
                          # সরাসরি ইভেন্ট হলে সংগ্রহ করবে
                          collected.append(el)
                  return collected

              def search(node):
                  if isinstance(node, dict):
                      # সনি লিভ কন্টেইনারস বা ট্রে
                      if "containers" in node and isinstance(node["containers"], list):
                          for c in node["containers"]:
                              if isinstance(c, dict) and "assets" in c and isinstance(c["assets"], list):
                                  collected.extend(c["assets"])
                      # সরাসরি লিস্ট কী
                      for key in ["matches", "events", "data", "items", "channels", "assets"]:
                          if key in node and isinstance(node[key], list):
                              for item in node[key]:
                                  if isinstance(item, dict):
                                      collected.append(item)
                              return
                      
                      for k, v in node.items():
                          if str(k).lower() not in ["owner", "credit", "website", "admin", "notice"]:
                              search(v)
                  elif isinstance(node, list):
                      for item in node:
                          search(item)

              search(data)

              # ইউনিক ইভেন্ট ফিল্টার
              final_items = []
              seen_ids = set()

              for it in collected:
                  if not isinstance(it, dict):
                      continue
                  v_info = it.get("video_info", {}) if isinstance(it.get("video_info"), dict) else {}
                  uid = (
                      it.get("match_id") or 
                      it.get("slug") or 
                      it.get("id") or 
                      it.get("contentId") or 
                      it.get("assetId") or 
                      it.get("title") or 
                      v_info.get("episodeTitle") or 
                      it.get("name")
                  )
                  if uid:
                      uid_str = str(uid).strip().lower()
                      if uid_str not in seen_ids:
                          seen_ids.add(uid_str)
                          final_items.append(it)
                  else:
                      final_items.append(it)

              return final_items

          def get_playlist_info(url_line):
              if "|" in url_line:
                  name, url = url_line.split("|", 1)
                  name = name.strip()
                  slug = re.sub(r'[^a-zA-Z0-9_-]', '_', name.lower()).strip('_')
                  return name, slug, url.strip()
              
              url = url_line.strip()
              base = os.path.splitext(os.path.basename(url.split("?")[0]))[0]
              slug = re.sub(r'[^a-zA-Z0-9_-]', '_', base).strip('_') if base else "playlist"
              return slug.replace("_", " ").title(), slug.lower(), url

          # ================= M3U BUILDER =================
          def parse_stream_details(stream_url_raw, item_meta):
              stream_url = str(stream_url_raw).strip()
              headers = {}

              if "|" in stream_url:
                  base_url, pipe_part = stream_url.split("|", 1)
                  base_url = base_url.strip()
                  for pair in pipe_part.split("&"):
                      if "=" in pair:
                          k, v = pair.split("=", 1)
                          k_lower = k.strip().lower()
                          if "user-agent" in k_lower:
                              headers["User-Agent"] = v.strip()
                          elif "refer" in k_lower:
                              headers["Referer"] = v.strip()
                          elif "cookie" in k_lower:
                              headers["Cookie"] = v.strip()
                          else:
                              headers[k.strip()] = v.strip()
              else:
                  base_url = stream_url

              item_headers = item_meta.get("headers", {}) if isinstance(item_meta.get("headers"), dict) else {}
              for hk, hv in item_headers.items():
                  if hv and hk not in headers:
                      headers[hk] = str(hv).strip()

              clearkey_val = ""
              for ck_name in ["drm_key", "clearkey", "clear_key", "key", "license_key"]:
                  if ck_name in item_meta and item_meta[ck_name]:
                      val = item_meta[ck_name]
                      if isinstance(val, str) and (":" in val or len(val) >= 32):
                          clearkey_val = val.strip()
                          break

              is_mpd = ".mpd" in base_url.lower() or item_meta.get("stream_type") == "DASH" or bool(clearkey_val)
              return base_url, headers, clearkey_val, is_mpd

          def build_m3u_channel_block(title, logo, group, stream_url_raw, item_meta):
              base_url, headers, clearkey, is_mpd = parse_stream_details(stream_url_raw, item_meta)
              if not base_url or not base_url.startswith("http"):
                  return ""

              block = []
              block.append(f'#EXTINF:-1 tvg-name="{title}" tvg-logo="{logo}" group-title="{group}",{title}\n')

              if is_mpd:
                  block.append("#KODIPROP:inputstream=inputstream.adaptive\n")
                  block.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd\n")
                  if clearkey:
                      block.append("#KODIPROP:inputstream.adaptive.license_type=clearkey\n")
                      block.append(f"#KODIPROP:inputstream.adaptive.license_key={clearkey}\n")

              if headers:
                  header_pairs = []
                  for hk, hv in headers.items():
                      if hk.lower() == "user-agent":
                          block.append(f"#EXTVLCOPT:http-user-agent={hv}\n")
                          header_pairs.append(f"User-Agent={hv}")
                      elif hk.lower() in ["referer", "referrer"]:
                          block.append(f"#EXTVLCOPT:http-referrer={hv}\n")
                          header_pairs.append(f"Referer={hv}")
                      else:
                          header_pairs.append(f"{hk}={hv}")

                  if header_pairs:
                      manifest_headers = "&".join(header_pairs)
                      block.append(f"#KODIPROP:inputstream.adaptive.manifest_headers={manifest_headers}\n")
                      block.append(f"#KODIPROP:inputstream.adaptive.stream_headers={manifest_headers}\n")

              if headers:
                  pipe_str = "&".join([f"{k}={v}" for k, v in headers.items()])
                  final_url = f"{base_url}|{pipe_str}\n"
              else:
                  final_url = f"{base_url}\n"

              block.append(final_url)
              return "".join(block)

          def generate_m3u(playlist_name, items, total_count, live_count, current_time):
              lines = ["#EXTM3U\n"]
              lines.append(f"# Playlist Name  : {playlist_name}\n")
              lines.append("# Developer      : MD ANAMUL HOQUE\n")
              lines.append(f"# Total Channels : {total_count}\n")
              lines.append(f"# Live Count     : {live_count}\n")
              lines.append(f"# Last Update    : {current_time}\n\n")

              lines.append('#EXTINF:-1 tvg-logo="https://i.ibb.co.com/XkDv6gpS/ireenTV.png" group-title="Bangla" tvg-name="IreenTV Promo",IreenTV Promo\nhttps://ireentvlive.pages.dev/promo/master.m3u8\n\n')

              for it in items:
                  title = it.get("title") or it.get("name") or "Live Event"
                  logo = it.get("cover_image") or it.get("logo") or ""

                  streams_list = it.get("stream_url", [])
                  if isinstance(streams_list, list) and len(streams_list) > 0:
                      for ch in streams_list:
                          if not isinstance(ch, dict):
                              continue
                          ch_url = ch.get("raw_link") or ch.get("url")
                          if not ch_url or not is_mpd_or_m3u8(str(ch_url)):
                              continue
                          ch_name = ch.get("channel_name") or "Live"
                          stream_title = f"{title} - {ch_name}" if len(streams_list) > 1 else title
                          lines.append(build_m3u_channel_block(stream_title, logo, playlist_name, str(ch_url).strip(), ch))

              return "".join(lines)

          # ================= MAIN EXECUTION =================
          print(f"Total Playlist URLs Found in Secrets: {len(lines)}")

          for idx, line in enumerate(lines, 1):
              name, slug, url = get_playlist_info(line)
              current_source_items = []

              try:
                  print(f"[{idx}/{len(lines)}] Fetching: {name} from {url[:55]}...")
                  raw_json = fetch_data(url)
                  raw_items = extract_items_from_json(raw_json)

                  for it in raw_items:
                      transformed = transform_universal_item(it)
                      if transformed:
                          current_source_items.append(transformed)

                  final_json_events = [PROMO_ITEM] + current_source_items
                  src_total = len(final_json_events)
                  src_live = sum(1 for it in final_json_events if is_live_event(it))

                  source_json = {
                      "playlist_name": name,
                      "developer": "MD ANAMUL HOQUE",
                      "channels_amount": src_total,
                      "live_count": src_live,
                      "last_update": current_time,
                      "events": final_json_events
                  }
                  with open(f"{slug}.json", "w", encoding="utf-8") as f:
                      json.dump(source_json, f, indent=2, ensure_ascii=False)

                  m3u_data = generate_m3u(name, current_source_items, src_total, src_live, current_time)
                  with open(f"{slug}.m3u", "w", encoding="utf-8") as f:
                      f.write(m3u_data)

                  print(f"✅ Success: {name} -> Created: {slug}.json & {slug}.m3u (Events: {src_total}, Live: {src_live})")

              except Exception as e:
                  print(f"❌ Error fetching {name} ({url}): {e}")

          print("🎯 All playlists processed successfully!")
          EOF

          python3 update_playlist.py
          rm -f update_playlist.py

      - name: Commit and Push
        run: |
          export TZ="Asia/Dhaka"
          git add *.json *.m3u
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Fixed Live Sports HD Duplication & Zyphora Sony LIV Sync ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi

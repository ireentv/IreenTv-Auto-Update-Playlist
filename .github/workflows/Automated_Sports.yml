name: Automated Sports Data JSON & M3U Updater

on:
  schedule:
    - cron: '*/15 * * * *'   # প্রতি ১৫ মিনিট পর পর স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch:
  repository_dispatch:
    types: [update-playlist] # রেন্ডার ওয়াচার বটের সংকেত

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "ireentv"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz urllib3

      - name: Fetch, Filter and Generate Separate JSON & All Multi-Server M3U Playlists
        env:
          JSON_PLAYLIST_URLS: ${{ secrets.JSON_PLAYLIST_URLS }}
        run: |
          git pull origin main --rebase

          cat << 'EOF' > update_playlist.py
          import os
          import re
          import json
          import requests
          import urllib3
          from datetime import datetime, timedelta
          import pytz

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          tz_bd = pytz.timezone("Asia/Dhaka")
          now_bd = datetime.now(tz_bd)
          current_time = now_bd.strftime("%I:%M %p %d-%m-%Y BST")

          raw_urls = os.environ.get("JSON_PLAYLIST_URLS", "")
          lines = [u.strip() for u in raw_urls.splitlines() if u.strip() and not u.strip().startswith("#")]

          # ================= PARSE & CONVERT TIME =================
          def parse_raw_datetime(time_str):
              """টাইম স্ট্রিং থেকে datetime অবজেক্ট (BST টাইমজোনে) রিটার্ন করবে"""
              if not time_str or not isinstance(time_str, (str, int, float)):
                  return None
              
              t_str = str(time_str).strip()
              if not t_str or t_str.lower() in ["24/7", "live", "n/a", "none", "tbd"]:
                  return None

              bd_tz = pytz.timezone("Asia/Dhaka")
              ist_tz = pytz.timezone("Asia/Kolkata")
              utc_tz = pytz.timezone("UTC")

              # Timestamp (Unix milliseconds or seconds)
              if re.match(r'^\d{10,13}$', t_str):
                  ts = int(t_str)
                  if len(t_str) == 13:
                      ts = ts / 1000.0
                  return datetime.fromtimestamp(ts, tz=bd_tz)

              is_ist = bool(re.search(r'\bIST\b', t_str, re.IGNORECASE))
              is_utc = bool(re.search(r'\b(UTC|GMT|Z)\b', t_str, re.IGNORECASE))

              clean_t = re.sub(r'\s*(IST|UTC|GMT|BST|Z)\s*$', '', t_str, flags=re.IGNORECASE).strip()

              formats = [
                  "%d/%m/%Y %I:%M %p",
                  "%d-%m-%Y %I:%M %p",
                  "%Y-%m-%d %I:%M %p",
                  "%d/%m/%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M",
                  "%d-%m-%Y %H:%M:%S",
                  "%d-%m-%Y %H:%M",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%dT%H:%M:%SZ",
                  "%Y-%m-%dT%H:%M:%S%z",
                  "%Y-%m-%dT%H:%M:%S.%fZ",
                  "%Y-%m-%dT%H:%M:%S",
                  "%I:%M %p %d-%m-%Y",
                  "%I:%M %p %d/%m/%Y",
                  "%b %d, %Y %I:%M %p",
                  "%b %d, %Y, %I:%M:%S %p",
                  "%d %b %Y %I:%M %p",
                  "%d %B %Y %I:%M %p"
              ]

              parsed_dt = None
              for fmt in formats:
                  try:
                      parsed_dt = datetime.strptime(clean_t, fmt)
                      break
                  except ValueError:
                      continue

              if parsed_dt:
                  if parsed_dt.tzinfo is not None:
                      return parsed_dt.astimezone(bd_tz)
                  elif is_ist:
                      return ist_tz.localize(parsed_dt).astimezone(bd_tz)
                  elif is_utc or "T" in clean_t:
                      return utc_tz.localize(parsed_dt).astimezone(bd_tz)
                  else:
                      return ist_tz.localize(parsed_dt).astimezone(bd_tz)

              return None

          def convert_to_bangladesh_time(time_str):
              dt = parse_raw_datetime(time_str)
              if dt:
                  return dt.strftime("%d/%m/%Y %I:%M %p BST")
              return str(time_str).strip() if time_str else ""

          # ================= INTELLIGENT DYNAMIC STATUS EVALUATOR =================
          def evaluate_status(raw_status, time_val_or_str, default_if_unknown="UPCOMING"):
              """
              সোর্স স্ট্যাটাস এবং বর্তমান সময়ের সাথে তুলনা করে সঠিক স্ট্যাটাস নির্ধারণ করে।
              """
              status_str = str(raw_status or "").strip().lower()

              # সোর্সে স্পষ্ট করে দেওয়া থাকলে
              if status_str in ["ended", "finished", "completed", "closed"]:
                  return "ENDED"
              if status_str in ["upcoming", "scheduled", "not started", "fixture"]:
                  source_indicates_upcoming = True
              else:
                  source_indicates_upcoming = False

              source_indicates_live = status_str in ["live", "playing", "in_progress", "started", "active"]

              # টাইম অ্যানালাইসিস
              dt = parse_raw_datetime(time_val_or_str)
              if dt:
                  # ম্যাচ শুরু হতে যদি এখনো বাকি থাকে
                  if dt > now_bd:
                      return "UPCOMING"
                  # ম্যাচ শুরু হয়েছে কিন্তু ৪ ঘণ্টার মধ্যে আছে
                  elif dt <= now_bd and (now_bd - dt) <= timedelta(hours=4):
                      if not source_indicates_upcoming:
                          return "LIVE"
                      return "UPCOMING"
                  # ৪ ঘণ্টার বেশি সময় পেরিয়ে গেলে
                  elif (now_bd - dt) > timedelta(hours=4):
                      if source_indicates_live:
                          return "LIVE"
                      return "ENDED"

              # সময় পাওয়া না গেলে বা স্পেসিফিক না হলে সোর্স স্ট্যাটাসকে প্রধান্য দেওয়া হবে
              if source_indicates_live:
                  return "LIVE"
              if source_indicates_upcoming:
                  return "UPCOMING"

              return default_if_unknown

          def is_live_event(item):
              if not isinstance(item, dict):
                  return False
              st = str(item.get("status", "")).upper()
              if st == "LIVE":
                  return True
              if item.get("is_playing") is True:
                  return True
              return False

          # ================= PROMO ITEM CONFIG =================
          PROMO_ITEM = {
              "match_id": "ireentv_promo",
              "title": "IreenTV Promo",
              "synopsis": "IreenTV Official 24/7 Promo",
              "status": "LIVE",
              "time": "24/7",
              "cover_image": "https://i.ibb.co.com/XkDv6gpS/ireenTV.png",
              "match_url": "https://ireentvlive.pages.dev/promo/master.m3u8",
              "is_free": True,
              "stream_url": {
                  "Server 1": "https://ireentvlive.pages.dev/promo/master.m3u8"
              }
          }

          def fetch_data(url):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*"
              }
              res = requests.get(url, headers=headers, timeout=30, verify=False)
              res.raise_for_status()
              clean_text = res.content.decode('utf-8-sig', errors='ignore').strip()
              return json.loads(clean_text)

          def is_mpd_or_m3u8(url):
              if not url or not isinstance(url, str):
                  return False
              u_str = url.strip()
              if not (u_str.startswith("http://") or u_str.startswith("https://")):
                  return False

              clean_path = u_str.split("|")[0].split("?")[0].lower()
              full_url = u_str.lower()

              if ".m3u8" in clean_path or ".mpd" in clean_path or ".m3u8" in full_url or ".mpd" in full_url:
                  if any(clean_path.endswith(ext) for ext in [".html", ".htm", ".php"]):
                      return False
                  return True
              return False

          # ================= SONY LIV =================
          def is_sonyliv_item(item):
              if not isinstance(item, dict):
                  return False
              if "multiple_audio_links" in item:
                  return True
              if "video_info" in item and ("stream_info" in item or "image_cdn" in item or "air_dates" in item):
                  return True
              if "contentId" in item and ("video_info" in item or "air_dates" in item or "stream_info" in item):
                  return True
              return False

          def extract_sonyliv_streams(item):
              servers = {}
              stream_info = item.get("stream_info", {}) if isinstance(item.get("stream_info"), dict) else {}
              dai = (
                  stream_info.get("dai_asset_key") or 
                  stream_info.get("dai_url") or 
                  item.get("dai_asset_key") or 
                  item.get("dai_url")
              )
              if dai and str(dai).startswith("http") and is_mpd_or_m3u8(str(dai)):
                  servers["Original Server"] = str(dai).strip()
              return servers

          def transform_sonyliv_item(item):
              v_info = item.get("video_info", {}) if isinstance(item.get("video_info"), dict) else {}
              img_cdn = item.get("image_cdn", {}) if isinstance(item.get("image_cdn"), dict) else {}
              air_dates = item.get("air_dates", {}) if isinstance(item.get("air_dates"), dict) else {}

              title = v_info.get("episodeTitle") or v_info.get("title") or item.get("title") or "Sports Match"
              synopsis = v_info.get("longDescription") or v_info.get("shortDescription") or item.get("synopsis") or title

              cover_image = (
                  img_cdn.get("landscape_thumb") or 
                  img_cdn.get("thumbnail") or 
                  img_cdn.get("portrait_thumb") or 
                  item.get("cover_image") or ""
              )

              stream_urls = extract_sonyliv_streams(item)
              raw_time = air_dates.get("originalAirDate") or air_dates.get("start_date") or item.get("time") or ""
              time_val = convert_to_bangladesh_time(raw_time)

              raw_status = item.get("status") or ("LIVE" if item.get("is_playing") else None)
              status = evaluate_status(raw_status, raw_time, default_if_unknown="UPCOMING")

              content_id = item.get('contentId') or item.get('match_id', '')
              match_url = stream_urls.get("Original Server") or (f"https://www.sonyliv.com/custom-live/{content_id}" if content_id else "")

              return {
                  "match_id": str(item.get("contentId") or item.get("match_id", "")),
                  "title": title,
                  "synopsis": synopsis,
                  "status": status,
                  "time": time_val,
                  "cover_image": cover_image,
                  "match_url": match_url,
                  "is_free": False,
                  "stream_url": stream_urls
              }

          # ================= TAPMAD =================
          def is_tapmad_item(item):
              if not isinstance(item, dict):
                  return False
              return any(k in item for k in ["EntityId", "VideoName", "CategoryName", "ThumbnailStandard", "ThumbnailTV", "CategoryId"])

          def transform_tapmad_item(item):
              video_name = item.get("VideoName") or ""
              category_name = item.get("CategoryName") or ""
              stage = item.get("StageName") or ""

              if category_name and video_name and category_name.lower() not in video_name.lower():
                  title = f"{category_name} - {video_name}"
              else:
                  title = video_name or category_name or item.get("title") or "Sports Match"

              if stage and stage not in title:
                  title = f"{title} ({stage})"

              synopsis = item.get("Description") or item.get("synopsis") or title
              cover_image = item.get("ThumbnailTV") or item.get("ThumbnailStandard") or item.get("Thumbnail") or item.get("cover_image") or ""

              stream_urls = {}
              raw_stream = item.get("stream_url") or item.get("StreamUrl") or item.get("videoURL") or item.get("video_url") or ""
              if isinstance(raw_stream, str) and raw_stream.startswith("http") and is_mpd_or_m3u8(raw_stream):
                  stream_urls["Server 1"] = raw_stream.strip()
              elif isinstance(raw_stream, dict):
                  stream_urls = {k: v for k, v in raw_stream.items() if is_mpd_or_m3u8(v)}

              first_url = next(iter(stream_urls.values())) if stream_urls else ""
              raw_time = item.get("EventStartDate") or item.get("time") or ""
              status_val = str(item.get("Status") or item.get("status") or "")
              
              status = evaluate_status(status_val, raw_time, default_if_unknown="UPCOMING")

              return {
                  "match_id": str(item.get("EntityId") or item.get("CategoryId") or item.get("id") or ""),
                  "title": title,
                  "synopsis": synopsis,
                  "status": status,
                  "time": convert_to_bangladesh_time(raw_time),
                  "cover_image": cover_image,
                  "match_url": item.get("match_url") or first_url,
                  "is_free": item.get("IsFreeToWatch", False),
                  "stream_url": stream_urls
              }

          # ================= BINGSTREAM =================
          def is_bingstream_item(item):
              if not isinstance(item, dict):
                  return False
              if any(k in item for k in ["link_live", "extracted_links", "cdn_domain", "stream_link", "chanel_id", "localteam_name"]):
                  return True
              source_val = str(item.get("source", "") or item.get("provider", "") or item.get("type", "")).lower()
              return "bing" in source_val

          def extract_bingstream_streams(item):
              servers = {}
              found_labeled_urls = []

              referer_val = item.get("referer") or item.get("referrer") or item.get("referer_url") or "https://iframe.rumsport11.site"
              if referer_val and not referer_val.endswith("/"):
                  referer_val += "/"

              user_agent_val = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              suffix = f"|http-user-agent={user_agent_val}&http-referrer={referer_val}"

              for ext_url in item.get("extracted_links", []):
                  if isinstance(ext_url, str) and is_mpd_or_m3u8(ext_url):
                      found_labeled_urls.append(("Server", ext_url.strip()))

              for k in ["videoURL", "video_url", "stream_url", "stream_link"]:
                  if k in item and item[k] and isinstance(item[k], str) and is_mpd_or_m3u8(item[k]):
                      found_labeled_urls.append(("Server", item[k].strip()))

              seen_urls = set()
              for idx, (label, u) in enumerate(found_labeled_urls, 1):
                  clean_u = u.split("|http-")[0] if "|http-" in u else u
                  if clean_u not in seen_urls:
                      seen_urls.add(clean_u)
                      servers[f"Server {idx}"] = f"{clean_u}{suffix}"

              return servers

          def transform_bingstream_item(item):
              team_a = item.get("localteam_name") or item.get("team_a") or ""
              team_b = item.get("visitorteam_name") or item.get("team_b") or ""
              match_title = f"{team_a} vs {team_b}" if team_a and team_b else ""
              title = item.get("name") or item.get("title") or match_title or "Sports Match"
              cover_image = item.get("cover_image") or item.get("thumbnail") or item.get("league_logo") or ""

              stream_urls = extract_bingstream_streams(item)
              raw_time = item.get("bd_time") or item.get("time") or ""
              raw_status = "LIVE" if item.get("is_playing") else item.get("status")
              
              status = evaluate_status(raw_status, raw_time, default_if_unknown="UPCOMING")

              return {
                  "match_id": str(item.get("id") or item.get("match_id") or ""),
                  "title": title,
                  "synopsis": title,
                  "status": status,
                  "time": convert_to_bangladesh_time(raw_time),
                  "cover_image": cover_image,
                  "match_url": next(iter(stream_urls.values())) if stream_urls else "",
                  "is_free": False,
                  "stream_url": stream_urls
              }

          # ================= CUSTOM / DASH DRM / LIVE SPORTS =================
          def is_custom_streams_item(item):
              if not isinstance(item, dict):
                  return False
              if "channels" in item and isinstance(item["channels"], list):
                  return True
              if "streams" in item and isinstance(item["streams"], list):
                  return True
              if any(k in item for k in ["team_a", "team_b", "teams", "event_name", "schedule_time", "slug", "sub_category"]):
                  return True
              return False

          def transform_custom_streams_item(item):
              teams = item.get("teams", {}) if isinstance(item.get("teams"), dict) else {}
              team_a = teams.get("team_a", {}) if isinstance(teams.get("team_a"), dict) else (item.get("team_a", {}) if isinstance(item.get("team_a"), dict) else {})
              team_b = teams.get("team_b", {}) if isinstance(teams.get("team_b"), dict) else (item.get("team_b", {}) if isinstance(item.get("team_b"), dict) else {})
              
              team_a_name = team_a.get("name", "").strip() if isinstance(team_a, dict) else ""
              team_b_name = team_b.get("name", "").strip() if isinstance(team_b, dict) else ""
              event_name = item.get("event_name", "").strip()
              category = item.get("sport") or item.get("category", "").strip()

              if team_a_name and team_b_name and (team_a_name.lower() != team_b_name.lower()):
                  match_title = f"{team_a_name} vs {team_b_name}"
                  title = f"{item.get('title')}: {match_title}" if item.get("title") else match_title
              else:
                  title = item.get("title") or event_name or item.get("name") or "Sports Match"

              synopsis = item.get("sub_category") or item.get("synopsis") or item.get("description") or (f"{category} | {title}" if category else title)

              cover_image = (
                  item.get("logo") or 
                  item.get("event_logo") or 
                  item.get("cover_image") or 
                  (team_a.get("flag") if isinstance(team_a, dict) else "") or 
                  (team_b.get("flag") if isinstance(team_b, dict) else "") or 
                  (team_a.get("logo") if isinstance(team_a, dict) else "") or 
                  (team_b.get("logo") if isinstance(team_b, dict) else "") or 
                  item.get("thumbnail") or ""
              )

              raw_channels = item.get("channels") if isinstance(item.get("channels"), list) else item.get("streams", [])
              stream_urls = {}
              channel_objects = []

              if isinstance(raw_channels, list):
                  for idx, s in enumerate(raw_channels, 1):
                      if isinstance(s, dict):
                          s_name = s.get("channel_name") or s.get("name") or f"Server {idx}"
                          s_link = s.get("raw_link") or s.get("url") or s.get("link") or s.get("stream_url") or ""
                          if s_link and is_mpd_or_m3u8(str(s_link)):
                              stream_urls[s_name.strip()] = str(s_link).strip()
                              channel_objects.append(s)
                      elif isinstance(s, str) and is_mpd_or_m3u8(s):
                          stream_urls[f"Server {idx}"] = s.strip()
                          channel_objects.append({"channel_name": f"Server {idx}", "url": s.strip()})

              first_url = next(iter(stream_urls.values())) if stream_urls else ""
              match_url = item.get("match_url") or first_url or ""

              sched = item.get("schedule", {}) if isinstance(item.get("schedule"), dict) else {}
              raw_time = (
                  sched.get("start_time_bst") or 
                  sched.get("raw_start_utc") or 
                  item.get("schedule_time") or 
                  item.get("time") or 
                  item.get("start_time") or ""
              )
              time_val = convert_to_bangladesh_time(raw_time)

              raw_status = item.get("status")
              status = evaluate_status(raw_status, raw_time, default_if_unknown="UPCOMING")

              return {
                  "match_id": str(item.get("slug") or item.get("id") or item.get("match_id", "")),
                  "title": title,
                  "synopsis": synopsis,
                  "status": status,
                  "time": time_val,
                  "cover_image": cover_image,
                  "match_url": match_url,
                  "is_free": False,
                  "stream_url": stream_urls,
                  "channels": channel_objects,
                  "streams": channel_objects
              }

          # ================= ALL MULTI-SERVER STREAM EXTRACTOR =================
          def extract_all_mpd_m3u8_streams(item):
              found_streams = {}
              def add_url(u, label=""):
                  if not u or not isinstance(u, str):
                      return
                  for part in re.split(r'[\r\n,]+', u.strip()):
                      clean_u = part.strip()
                      if is_mpd_or_m3u8(clean_u):
                          cmp_u = clean_u.split('|')[0].strip()
                          if cmp_u not in found_streams:
                              found_streams[cmp_u] = (label.strip(), clean_u)

              def crawl_item(data, parent_key=""):
                  if isinstance(data, dict):
                      for k, v in data.items():
                          k_lower = str(k).lower()
                          if k_lower in ["cover_image", "thumbnail", "image", "logo", "synopsis", "description"]:
                              continue
                          current_prefix = f"{parent_key} - {k}" if parent_key else str(k)
                          if isinstance(v, str):
                              add_url(v, label=current_prefix)
                          elif isinstance(v, (dict, list)):
                              crawl_item(v, parent_key=current_prefix)
                  elif isinstance(data, list):
                      for idx, el in enumerate(data, 1):
                          lbl = f"{parent_key} {idx}".strip() if parent_key else f"Server {idx}"
                          if isinstance(el, str):
                              add_url(el, label=lbl)
                          elif isinstance(el, (dict, list)):
                              crawl_item(el, parent_key=lbl)

              crawl_item(item)
              servers = {}
              for idx, (lbl, url) in enumerate(found_streams.values(), 1):
                  servers[f"Server {idx}"] = url
              return servers

          # 🎯 SMART EXTRACTOR
          def extract_items_from_json(data):
              items = []
              if isinstance(data, list):
                  return data

              for root_key in ["events", "matches", "data", "items", "channels", "list"]:
                  if root_key in data and isinstance(data[root_key], list):
                      return data[root_key]

              def walk(obj):
                  if isinstance(obj, list):
                      for elem in obj:
                          walk(elem)
                  elif isinstance(obj, dict):
                      is_match_item = False
                      has_media = any(k in obj for k in ["channels", "link_live", "extracted_links", "cdn_domain", "stream_link", "video_info", "stream_info", "stream_url", "multiple_audio_links", "video_url", "videoURL", "url", "streams"])
                      has_sports = any(k in obj for k in ["localteam_name", "visitorteam_name", "teams", "VideoName", "CategoryName", "sport", "event_name", "team_a", "team_b", "schedule", "slug", "sub_category"])

                      if has_media or has_sports:
                          is_match_item = True
                      elif any(k in obj for k in ["title", "name", "VideoName"]) and any(k in obj for k in ["match_url", "status", "stream_url", "cover_image", "url", "channels"]):
                          is_match_item = True

                      if is_match_item:
                          items.append(obj)
                      else:
                          for k, v in obj.items():
                              if str(k).lower() in ["owner", "credit", "website", "admin", "notice"]:
                                  continue
                              walk(v)
              walk(data)

              seen = set()
              unique_items = []
              for it in items:
                  if not isinstance(it, dict):
                      continue
                  uid = (
                      it.get("slug") or 
                      it.get("id") or 
                      it.get("contentId") or 
                      it.get("match_id") or 
                      it.get("EntityId") or 
                      (f"{it.get('title')}_{it.get('schedule', {}).get('start_time_bst')}" if isinstance(it.get('schedule'), dict) else None) or
                      it.get("title") or 
                      it.get("name")
                  )
                  if uid and uid not in seen:
                      seen.add(uid)
                      unique_items.append(it)
                  elif not uid:
                      unique_items.append(it)
              return unique_items

          def get_playlist_info(url_line):
              if "|" in url_line:
                  name, url = url_line.split("|", 1)
                  name = name.strip()
                  slug = re.sub(r'[^a-zA-Z0-9_-]', '_', name.lower()).strip('_')
                  return name, slug, url.strip()
              
              url = url_line.strip()
              url_lower = url.lower()
              if "willow" in url_lower:
                  return "Willow", "willow", url
              elif "live_sports" in url_lower:
                  return "Live Sports", "live_sports", url
              elif "prime" in url_lower:
                  return "PrimeVideo", "primevideo", url
              elif "sony" in url_lower:
                  return "Sony LIV", "sonyliv", url
              elif "tapmad" in url_lower:
                  return "Tapmad", "tapmad", url
              elif "bing" in url_lower or "bingstream" in url_lower:
                  return "Bingstream", "bingstream", url
              elif "sports_data" in url_lower:
                  return "Sports Data", "sports_data", url
              else:
                  base = os.path.splitext(os.path.basename(url.split("?")[0]))[0]
                  slug = re.sub(r'[^a-zA-Z0-9_-]', '_', base).strip('_') if base else "playlist"
                  return slug.replace("_", " ").title(), slug.lower(), url

          # ================= M3U PARSER =================
          def parse_stream_details(stream_url_raw, item_meta):
              stream_url = str(stream_url_raw).strip()
              headers = {}

              if "|" in stream_url:
                  base_url, pipe_part = stream_url.split("|", 1)
                  base_url = base_url.strip()
                  for pair in pipe_part.split("&"):
                      if "=" in pair:
                          k, v = pair.split("=", 1)
                          k_lower = k.strip().lower()
                          if "user-agent" in k_lower:
                              headers["User-Agent"] = v.strip()
                          elif "refer" in k_lower:
                              headers["Referer"] = v.strip()
                          elif "cookie" in k_lower:
                              headers["Cookie"] = v.strip()
                          else:
                              headers[k.strip()] = v.strip()
              else:
                  base_url = stream_url

              item_headers = item_meta.get("headers", {}) if isinstance(item_meta.get("headers"), dict) else {}
              for hk, hv in item_headers.items():
                  if hv and hk not in headers:
                      headers[hk] = str(hv).strip()

              clearkey_val = ""
              for ck_name in ["drm_key", "clearkey", "clear_key", "key", "license_key"]:
                  if ck_name in item_meta and item_meta[ck_name]:
                      val = item_meta[ck_name]
                      if isinstance(val, str) and (":" in val or len(val) >= 32):
                          clearkey_val = val.strip()
                          break

              is_mpd = ".mpd" in base_url.lower() or item_meta.get("stream_type") == "DASH" or bool(clearkey_val)
              return base_url, headers, clearkey_val, is_mpd

          def build_m3u_channel_block(title, logo, group, stream_url_raw, item_meta):
              base_url, headers, clearkey, is_mpd = parse_stream_details(stream_url_raw, item_meta)
              if not base_url or not base_url.startswith("http"):
                  return ""

              block = []
              block.append(f'#EXTINF:-1 tvg-name="{title}" tvg-logo="{logo}" group-title="{group}",{title}\n')

              if is_mpd:
                  block.append("#KODIPROP:inputstream=inputstream.adaptive\n")
                  block.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd\n")
                  if clearkey:
                      block.append("#KODIPROP:inputstream.adaptive.license_type=clearkey\n")
                      block.append(f"#KODIPROP:inputstream.adaptive.license_key={clearkey}\n")

              if headers:
                  header_pairs = []
                  for hk, hv in headers.items():
                      if hk.lower() == "user-agent":
                          block.append(f"#EXTVLCOPT:http-user-agent={hv}\n")
                          header_pairs.append(f"User-Agent={hv}")
                      elif hk.lower() in ["referer", "referrer"]:
                          block.append(f"#EXTVLCOPT:http-referrer={hv}\n")
                          header_pairs.append(f"Referer={hv}")
                      else:
                          header_pairs.append(f"{hk}={hv}")

                  if header_pairs:
                      manifest_headers = "&".join(header_pairs)
                      block.append(f"#KODIPROP:inputstream.adaptive.manifest_headers={manifest_headers}\n")
                      block.append(f"#KODIPROP:inputstream.adaptive.stream_headers={manifest_headers}\n")

              if headers:
                  pipe_str = "&".join([f"{k}={v}" for k, v in headers.items()])
                  final_url = f"{base_url}|{pipe_str}\n"
              else:
                  final_url = f"{base_url}\n"

              block.append(final_url)
              return "".join(block)

          # ================= M3U BUILDER =================
          def generate_m3u(playlist_name, items, total_count, live_count, current_time):
              lines = ["#EXTM3U\n"]
              lines.append(f"# Playlist Name  : {playlist_name}\n")
              lines.append("# Developer      : MD ANAMUL HOQUE\n")
              lines.append(f"# Total Channels : {total_count}\n")
              lines.append(f"# Live Count     : {live_count}\n")
              lines.append(f"# Last Update    : {current_time}\n\n")

              lines.append('#EXTINF:-1 tvg-logo="https://i.ibb.co.com/XkDv6gpS/ireenTV.png" group-title="Bangla" tvg-name="IreenTV Promo",IreenTV Promo\nhttps://ireentvlive.pages.dev/promo/master.m3u8\n\n')

              for it in items:
                  title = it.get("title") or it.get("name") or "Live Event"
                  logo = it.get("cover_image") or it.get("logo") or ""

                  channels_list = it.get("channels") or it.get("streams")
                  if isinstance(channels_list, list) and len(channels_list) > 0:
                      for ch in channels_list:
                          if not isinstance(ch, dict):
                              continue
                          ch_url = ch.get("raw_link") or ch.get("url") or ch.get("link") or ch.get("stream_url")
                          if not ch_url or not is_mpd_or_m3u8(str(ch_url)):
                              continue
                          ch_name = ch.get("channel_name") or ch.get("name") or "Live"
                          stream_title = f"{title} - {ch_name}"
                          lines.append(build_m3u_channel_block(stream_title, logo, playlist_name, str(ch_url).strip(), ch))

                  elif isinstance(it.get("stream_url"), dict) and it.get("stream_url"):
                      for s_name, s_url in it.get("stream_url").items():
                          if s_url and is_mpd_or_m3u8(str(s_url)):
                              stream_title = f"{title} ({s_name})" if len(it["stream_url"]) > 1 else title
                              lines.append(build_m3u_channel_block(stream_title, logo, playlist_name, str(s_url).strip(), it))
                  else:
                      streams = extract_all_mpd_m3u8_streams(it)
                      for s_name, s_url in streams.items():
                          stream_title = f"{title} ({s_name})" if len(streams) > 1 else title
                          lines.append(build_m3u_channel_block(stream_title, logo, playlist_name, s_url, it))

              return "".join(lines)

          # ================= MAIN EXECUTION =================
          print(f"Total Playlist URLs Found in Secrets: {len(lines)}")

          for idx, line in enumerate(lines, 1):
              name, slug, url = get_playlist_info(line)
              current_source_items = []

              is_bing_source = ("bing" in name.lower() or "bing" in url.lower() or "bingstream" in url.lower())
              is_tapmad_source = ("tapmad" in name.lower() or "tapmad" in url.lower())

              try:
                  print(f"[{idx}/{len(lines)}] Fetching: {name} from {url[:45]}...")
                  raw_json = fetch_data(url)
                  raw_items = extract_items_from_json(raw_json)

                  for it in raw_items:
                      if not isinstance(it, dict):
                          continue
                      
                      if is_sonyliv_item(it):
                          item_transformed = transform_sonyliv_item(it)
                      elif is_tapmad_source or is_tapmad_item(it):
                          item_transformed = transform_tapmad_item(it)
                      elif is_bing_source or is_bingstream_item(it):
                          item_transformed = transform_bingstream_item(it)
                      elif is_custom_streams_item(it):
                          item_transformed = transform_custom_streams_item(it)
                      else:
                          # জেনেরিক আইটেমের ক্ষেত্রেও টাইম ও স্ট্যাটাস যাচাই
                          time_val = convert_to_bangladesh_time(it.get("time") or it.get("start_time") or "")
                          it["time"] = time_val
                          it["status"] = evaluate_status(it.get("status"), it.get("time"), default_if_unknown="UPCOMING")
                          item_transformed = it

                      current_source_items.append(item_transformed)

                  final_json_events = [PROMO_ITEM] + current_source_items
                  src_total = len(final_json_events)
                  src_live = sum(1 for it in final_json_events if is_live_event(it))

                  source_json = {
                      "playlist_name": name,
                      "developer": "MD ANAMUL HOQUE",
                      "channels_amount": src_total,
                      "live_count": src_live,
                      "last_update": current_time,
                      "events": final_json_events
                  }
                  with open(f"{slug}.json", "w", encoding="utf-8") as f:
                      json.dump(source_json, f, indent=2, ensure_ascii=False)

                  m3u_data = generate_m3u(name, current_source_items, src_total, src_live, current_time)
                  with open(f"{slug}.m3u", "w", encoding="utf-8") as f:
                      f.write(m3u_data)

                  print(f"✅ Success: {name} -> Created: {slug}.json & {slug}.m3u (Total: {src_total}, Live: {src_live})")

              except Exception as e:
                  print(f"❌ Error fetching {name} ({url}): {e}")

          print("🎯 All playlists processed successfully!")
          EOF

          python3 update_playlist.py
          rm -f update_playlist.py

      - name: Commit and Push
        run: |
          export TZ="Asia/Dhaka"
          git add *.json *.m3u
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Playlists Synced (Dynamic BST Time & Status Updated) ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi
